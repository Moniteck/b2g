<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1EDE9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151312" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<title>Sin conexión · CRM B2G</title>
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
<!-- Página que muestra el service worker (public/sw.js) cuando una pantalla no carga por falta de red.
     Autónoma (sin JS ni recursos externos) para funcionar sin conexión y con cualquier CSP.
     Colores de resources/design/tokens.json. -->
<style>
  :root { color-scheme: light dark; --page: #F1EDE9; --card: #FFFDFB; --line: #E6DFD8; --text: #1E1B1A; --soft: #695F58; --brand: #B12530; --brand-hover: #951F28; }
  @media (prefers-color-scheme: dark) { :root { --page: #151312; --card: #1E1B1A; --line: #3A3A3A; --text: #E9E4E0; --soft: #D2CAC3; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center;
    padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
    background: var(--page); color: var(--text);
    font: 400 15px/1.55 Inter, "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  }
  main { width: 100%; max-width: 420px; padding: 32px 24px; border: 1px solid var(--line); border-radius: 20px; background: var(--card); text-align: center; }
  svg { display: block; margin: 0 auto 12px; }
  .brand { margin: 0 0 18px; font: 600 12px/1 Poppins, Inter, system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--soft); }
  h1 { margin: 0 0 8px; font: 600 21px/1.3 Poppins, Inter, system-ui, sans-serif; }
  p { margin: 0 0 22px; color: var(--soft); }
  a.retry {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 22px;
    border-radius: 12px; background: var(--brand); color: #FFFFFF; font-weight: 600; text-decoration: none;
  }
  a.retry:hover { background: var(--brand-hover); }
  a.retry:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
  small { display: block; margin-top: 18px; font-size: 12.5px; color: var(--soft); }
</style>
</head>
<body>
<main>
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 150" width="150" height="141" role="img" aria-label="Lici preocupado: no hay conexión">

    </g>
  </svg>
  <p class="brand">CRM B2G</p>
  <h1>Sin conexión</h1>
  <p>Lici no logra comunicarse con el servidor. Revise su conexión a internet y vuelva a intentarlo.</p>
  <a class="retry" href="">Reintentar</a>

</main>
</body>
</html>
