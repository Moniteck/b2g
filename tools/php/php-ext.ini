; Extensiones PHP necesarias en el entorno de desarrollo local (Windows).
; El VPS de produccion (Linux) ya incluye sodium y pdo_sqlite de forma nativa.
;
; Uso en Windows:
;   $env:PHP_INI_SCAN_DIR = "C:\ruta\del\proyecto\tools\php"
;   php artisan serve

extension=sodium
extension=pdo_sqlite
extension=sqlite3
